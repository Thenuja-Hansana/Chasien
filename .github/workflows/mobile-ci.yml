name: mobile-ci

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major as local development. `npm ci` here is strict about
          # package-lock.json: a lock written by npm 11.6.x leaves out
          # @napi-rs/wasm-runtime's peers (@emnapi/core, @emnapi/runtime),
          # which npm 10 and current npm 11 both require, so every run from
          # 2026-09-07 to 2026-09-22 failed at `npm ci` before lint or
          # typecheck ran. If it fails with "Missing: ... from lock file",
          # regenerate the lock with a current npm (see decision-log,
          # 2026-09-22), not with the npm that wrote it.
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Lint and typecheck both pass on a component the React Compiler has
      # silently skipped, so neither catches the regression this does.
      - run: npm run check:compiler
