name: mobile-ci

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the npm major that writes package-lock.json locally
          # (Node 24 / npm 11). Node 22's npm 10 rejects that lock file in
          # `npm ci` ("Missing: @emnapi/core ... from lock file"), which
          # failed every run from 2026-09-07 to 2026-09-22 before lint or
          # typecheck ever ran.
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Lint and typecheck both pass on a component the React Compiler has
      # silently skipped, so neither catches the regression this does.
      - run: npm run check:compiler
